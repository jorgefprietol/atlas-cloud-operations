server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.amazoncognito.com https://*.amazonaws.com; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location /health/ { proxy_pass http://api:8080; }
  location = /config.json { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }
}
